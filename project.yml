name: NDICast
options:
  bundleIdPrefix: com.local.ndicast
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    ENABLE_BITCODE: NO
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"

targets:
  NDICast:
    type: application
    platform: iOS
    sources:
      - path: NDICast
    dependencies:
      - target: BroadcastExtension
        embed: true
      - framework: vendor/NDI/libndi_ios.a
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.ndicast
        INFOPLIST_FILE: NDICast/Info.plist
        CODE_SIGN_ENTITLEMENTS: NDICast/NDICast.entitlements
        HEADER_SEARCH_PATHS: "$(SRCROOT)/vendor/NDI/include"
        SWIFT_OBJC_BRIDGING_HEADER: NDICast/Bridging-Header.h
        LIBRARY_SEARCH_PATHS: "$(SRCROOT)/vendor/NDI"
        OTHER_LDFLAGS: >-
          -ObjC -lc++
          -framework Accelerate
          -framework VideoToolbox
          -framework CoreVideo
          -framework CoreMedia
          -framework CoreAudio
          -framework AudioToolbox
          -framework CoreServices
          -framework AVFoundation
          -framework CoreImage
          -framework Security
          -framework CoreFoundation

  BroadcastExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: BroadcastExtension
    dependencies:
      - framework: vendor/NDI/libndi_ios.a
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.ndicast.broadcast
        INFOPLIST_FILE: BroadcastExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: BroadcastExtension/BroadcastExtension.entitlements
        HEADER_SEARCH_PATHS: "$(SRCROOT)/vendor/NDI/include"
        SWIFT_OBJC_BRIDGING_HEADER: BroadcastExtension/Bridging-Header.h
        LIBRARY_SEARCH_PATHS: "$(SRCROOT)/vendor/NDI"
        OTHER_LDFLAGS: >-
          -ObjC -lc++
          -framework Accelerate
          -framework VideoToolbox
          -framework CoreVideo
          -framework CoreMedia
          -framework CoreAudio
          -framework AudioToolbox
          -framework CoreServices
          -framework AVFoundation
          -framework CoreImage
          -framework Security
          -framework CoreFoundation
