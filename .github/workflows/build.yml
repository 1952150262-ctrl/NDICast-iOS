name: build-ipa

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Prepare NDI library
        run: |
          ls -l vendor/NDI
          if [ -f vendor/NDI/libndi_ios.a.gz ] && [ ! -f vendor/NDI/libndi_ios.a ]; then
            gunzip -c vendor/NDI/libndi_ios.a.gz > vendor/NDI/libndi_ios.a
          fi
          ls -lh vendor/NDI/libndi_ios.a
          ls vendor/NDI/include | head -5

      - name: Generate project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project NDICast.xcodeproj \
            -scheme NDICast \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/NDICast.app Payload/
          zip -qry NDICast-unsigned.ipa Payload
          ls -lh NDICast-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: NDICast-unsigned
          path: NDICast-unsigned.ipa
